spring.application.name=Subscription-Service
server.port=8086
spring.datasource.url=jdbc:postgresql://postgres:5432/job_portal_subscription
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10

stripe.secretKey=${STRIPE_SECRET_KEY}
stripe.webhook.secretKey=${STRIPE_WEBHOOK_SECRET}

spring.application.key=${JWT_SECRET}
spring.application.token.expiry=36000000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html