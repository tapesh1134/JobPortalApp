spring.application.name=Auth-Service
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/job-portal-auth
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.instance.prefer-ip-address=true

spring.application.key=
spring.application.token.expiry=36000000

spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/auth/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.github.client-id=
spring.security.oauth2.client.registration.github.client-secret=
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/api/auth/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.scope=email,profile

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html